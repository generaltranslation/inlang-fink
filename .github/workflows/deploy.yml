name: Deploy Worker
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true
env:
  CLOUDFLARE_ACCOUNT_ID: 00246eb74c164b5dbee7d3ee028463c7
  WRANGLER_SEND_METRICS: false
jobs:
  deploy:
    # PRs from this repository deploy previews; production deploys only from main.
    if: github.event.action != 'closed' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Deploy with environment secrets
        id: deploy
        env:
          WORKER_NAME: ${{ github.event_name == 'pull_request' && format('fink-pr-{0}', github.event.pull_request.number) || 'fink' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_SECRET: ${{ secrets.FINK_GITHUB_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.FINK_SESSION_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN in this GitHub deployment environment.'; exit 1; }
          node scripts/deploy.mjs "$WORKER_NAME"
          if [ "$WORKER_NAME" = fink ]; then
            url=https://fink.inlang.com
          else
            url="https://${WORKER_NAME}.generaltranslation.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Delete closed PR Worker
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN in the preview GitHub environment.'; exit 1; }
          pnpm exec wrangler delete --name "fink-pr-${PR_NUMBER}" --force
